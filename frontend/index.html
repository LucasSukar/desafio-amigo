<!doctype html>
<html ng-app="amigoApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amigo — Feed de Publicações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.amigotech.com.br/amigo-apps/doca-ui/min.css"
    />
    <link rel="stylesheet" href="./css/design-system.css" />
    <link rel="stylesheet" href="./css/feed.css" />
    <link rel="stylesheet" href="./css/perfil.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/cadastro.css" />
    <link rel="stylesheet" href="./css/criar-publicacao.css" />
    <link rel="stylesheet" href="./css/post.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/seguindo.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--color-surface-soft, #f1f4f7);
        color: var(--color-ink, #1c1e21);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main[ng-view] {
        display: block;
      }
    </style>
  </head>
  <body ng-controller="MainController">
    <div class="app-layout">
      <aside class="app-sidebar">
        <div class="app-sidebar__brand" ng-click="irParaFeed()" style="cursor: pointer;">
          <div class="app-sidebar__logo-mark">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
            </svg>
          </div>
          <span class="app-sidebar__name">Amigo X</span>
        </div>

        <div class="sidebar-search" ng-if="estaLogado">
          <div class="sidebar-search__wrapper">
            <span class="sidebar-search__icon">🔍</span>
            <input
              type="text"
              class="sidebar-search__input"
              placeholder="Buscar pessoas..."
              ng-model="searchText"
              ng-focus="onSearchFocus()"
              ng-blur="onSearchBlur()"
              id="input-buscar-pessoas"
              autocomplete="off"
            />
          </div>

          <!-- Lista de resultados da pesquisa -->
          <div
            class="sidebar-search__results"
            ng-show="mostrarListaUsuarios && searchText.length > 0"
          >
            <div
              class="sidebar-search__result-item"
              ng-repeat="u in todosUsuarios | filter:{name: searchText} | limitTo:5"
            >
              <div class="sidebar-search__result-info" ng-click="irParaPerfilUsuario(u.id)" id="btn-ir-perfil-{{ u.id }}">
                <img
                  ng-if="u.avatar_url"
                  ng-src="http://localhost:3333/uploads/{{ u.avatar_url }}"
                  class="sidebar-search__avatar"
                  alt="{{ u.name }}"
                  style="object-fit: cover;"
                />
                <div ng-if="!u.avatar_url" class="sidebar-search__avatar" style="display: flex; align-items: center; justify-content: center; background: var(--color-ink-deep); color: var(--color-canvas); font-size: 14px; font-weight: 700;">
                  {{ u.name ? u.name.charAt(0).toUpperCase() : '?' }}
                </div>
                <span class="sidebar-search__name">{{ u.name }}</span>
              </div>
              <button
                class="sidebar-search__follow-btn"
                ng-class="{ 'sidebar-search__follow-btn--following': u.jaSigo }"
                ng-click="seguirUsuario(u, $event)"
                id="btn-seguir-search-{{ u.id }}"
              >
                <span ng-if="!u.jaSigo">+</span>
                <span ng-if="u.jaSigo">✔</span>
              </button>
            </div>
            <div
              class="sidebar-search__empty"
              ng-if="(todosUsuarios | filter:{name: searchText}).length === 0"
            >
              Nenhum usuário encontrado.
            </div>
          </div>
        </div>

        <nav class="app-sidebar__nav">
          <button class="app-sidebar__nav-item" ng-click="irParaFeed()" id="btn-nav-feed">
            <span class="icon">🏠</span> Feed
          </button>
          <button class="app-sidebar__nav-item" ng-click="irParaSeguindo()" ng-if="estaLogado" id="btn-nav-seguindo">
            <span class="icon">👥</span> Pessoas que sigo
          </button>
          <button class="app-sidebar__nav-item" ng-click="irParaCriarPublicacao()" ng-if="estaLogado" id="btn-nav-publicar">
            <span class="icon">✍️</span> Publicar
          </button>
        </nav>

        <div class="app-sidebar__footer">
          <div class="app-sidebar__user" ng-if="estaLogado">
            <div class="app-sidebar__user-info" ng-click="irParaPerfil()">
              <img ng-if="usuario.avatar_url" ng-src="http://localhost:3333/uploads/{{ usuario.avatar_url }}" class="app-sidebar__avatar" />
              <div ng-if="!usuario.avatar_url" class="app-sidebar__avatar-placeholder">{{ usuario.name.charAt(0).toUpperCase() }}</div>
              <span class="app-sidebar__user-name">{{ usuario.name }}</span>
            </div>
            <button class="doca-button doca-button--tertiary app-sidebar__logout" ng-click="deslogar()">Sair</button>
          </div>
          
          <div class="app-sidebar__auth" ng-if="!estaLogado">
            <p class="app-sidebar__auth-text">Faça login para publicar e interagir.</p>
            <button class="doca-button doca-button--primary doca-mb-2" style="width: 100%" ng-click="abrirModalLogin()">Entrar</button>
            <button class="doca-button doca-button--secondary" style="width: 100%" ng-click="abrirModalCadastro()">Criar conta</button>
          </div>
        </div>
      </aside>

      <main class="app-layout__main" ng-view></main>
    </div>

    <script src="./lib/angular.js"></script>
    <script src="./lib/angular-route.js"></script>
    <script src="./lib/ui-bootstrap-tpls-0.12.1.min.js"></script>

    <script src="./js/app.js"></script>
    <script src="./js/config/routeConfig.js"></script>
    <script src="./js/value/configValue.js"></script>
    <script src="./js/controllers/MainController.js"></script>
    <script src="./js/controllers/FeedController.js"></script>
    <script src="./js/services/FeedService.js"></script>
    <script src="./js/controllers/PerfilController.js"></script>
    <script src="./js/services/PerfilService.js"></script>
    <script src="./js/services/LoginService.js"></script>
    <script src="./js/services/UsuarioService.js"></script>
    <script src="./js/controllers/PerfilUsuarioController.js"></script>
    <script src="./js/controllers/SeguindoController.js"></script>
    <script src="./js/controllers/CriarPublicacaoController.js"></script>
    <script src="./js/controllers/moldals/ModalLoginController.js"></script>
    <script src="./js/controllers/moldals/ModalCadastroController.js"></script>
    <script src="./js/controllers/moldals/ModalEdicaoController.js"></script>
    <script src="./js/controllers/moldals/ModalEditarPerfilController.js"></script>
    <script src="./js/controllers/PostController.js"></script>
    <script src="./js/directives/feedCard.js"></script>
    <script src="./js/directives/likeBtn.js"></script>
    <script src="./js/directives/loader.js"></script>
  </body>
</html>

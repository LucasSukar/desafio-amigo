<div class="doca-page perfil-page">
  <div class="perfil-page__top-bar">
    <h1 class="doca-page__title perfil-page__main-title">Meu Perfil</h1>
    <button class="doca-button doca-button--secondary perfil-page__logout-btn" ng-click="deslogar()">Sair</button>
  </div>

  <hr class="doca-mb-3" />
  <h2 class="doca-page__subtitle">Minhas Publicações</h2>

  <div
    class="doca-page__box doca-mb-3 perfil-page__item"
    ng-repeat="pub in publicacoes"
  >
    <div class="doca-flex perfil-page__header">
      <h3 class="perfil-page__title">{{ pub.title }}</h3>

      <div class="perfil-page__menu">
        <button
          class="doca-button doca-button--tertiary"
          ng-click="toggleOpcoes(pub)"
        >
          <span class="perfil-page__menu-trigger">⋮</span>
        </button>

        <div ng-show="pub.mostrarOpcoes" class="perfil-page__menu-panel">
          <button
            class="doca-button doca-button--tertiary doca-mb-2 perfil-page__menu-action"
            ng-click="prepararEdicao(pub)"
          >
            Editar
          </button>
          <button
            class="doca-button doca-button--tertiary perfil-page__menu-action perfil-page__menu-action--danger"
            ng-click="deletar(pub.id)"
          >
            Apagar
          </button>
        </div>
      </div>
    </div>

    <p class="doca-text--normal doca-text--base doca-mt-2">{{ pub.content }}</p>
  </div>

  <div
    ng-if="publicacoes.length === 0"
    class="doca-text-center doca-text--base perfil-page__empty"
  >
    Você ainda não tem publicações.
  </div>

  <div
    id="modalEdicao"
    class="doca-modal__backdrop perfil-page__modal-backdrop"
  >
    <div class="doca-modal perfil-page__modal">
      <div class="doca-modal__header perfil-page__modal-header">
        <h2 class="perfil-page__modal-title">Editar Publicação</h2>
        <button
          class="doca-button doca-button--tertiary perfil-page__modal-close"
          ng-click="fecharModal()"
        >
          ✕
        </button>
      </div>

      <div class="doca-modal__content perfil-page__modal-content">
        <div class="doca-form__field doca-mb-3">
          <label class="doca-form__label">Título</label>
          <input
            class="doca-form-control perfil-page__input"
            type="text"
            ng-model="postEditando.title"
          />
        </div>
        <div class="doca-form__field">
          <label class="doca-form__label">Conteúdo</label>
          <textarea
            class="doca-form-control perfil-page__textarea"
            rows="5"
            ng-model="postEditando.content"
          ></textarea>
        </div>
      </div>

      <div class="doca-modal__footer perfil-page__modal-footer">
        <button
          class="doca-button doca-button--secondary"
          ng-click="fecharModal()"
        >
          Cancelar
        </button>
        <button
          class="doca-button doca-button--primary"
          ng-click="salvarEdicao()"
        >
          Salvar
        </button>
      </div>
    </div>
  </div>
</div>

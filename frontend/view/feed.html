<div class="doca-page feed-page">
  <div class="feed-page__top-bar">
    <h2 class="doca-page__title feed-page__main-title">Feed de Publicações</h2>
    <div class="feed-page__top-actions">
      <button class="doca-button doca-button--primary" ng-click="irParaCriarPublicacao()">+ Criar Publicação</button>
      <button class="doca-button doca-button--secondary" ng-click="irParaPerfil()">Meu Perfil</button>
    </div>
  </div>

  <div class="doca-page__box doca-mb-3" ng-repeat="post in posts">
    <div class="doca-flex doca-mb-3 feed-page__header">
      <span class="doca-badge doca-badge--info feed-page__badge">
        {{ post.user.name.charAt(0) | uppercase }}
      </span>
      <h3 class="feed-page__title">{{ post.title }}</h3>
    </div>

    <div class="doca-mb-3">
      <p><strong>Resumo:</strong> {{ post.resume }}</p>
      <p class="doca-text--normal doca-text--base">{{ post.content }}</p>
      <small class="feed-page__date"
        >Publicado em: {{ post.data_publicacao | date:'dd/MM/yyyy HH:mm'
        }}</small
      >
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <button
        class="doca-button doca-button--primary"
        ng-click="curtirPost(post)"
      >
        Curtir
        <span class="doca-badge doca-badge--info feed-page__likes"
          >{{ post.total_likes }}</span
        >
      </button>
      <button
        class="doca-button doca-button--primary"
        ng-if="post.tentouCurtirDeslogado"
        ng-click="irParaLogin()"
      >
        Fazer Login
      </button>
    </div>
  </div>
</div>

<div class="feed-page">


  <main class="feed-content">
    <h1 class="feed-content__title">Publicações</h1>

    <amigo-feed-card ng-repeat="post in posts" post="post" on-like="curtirPost(post)" on-edit="prepararEdicao(post)"
      on-delete="deletePost(id)" on-click="irParaPost(id)" on-click-profile="irParaPerfilUsuario(id)"></amigo-feed-card>

    <amigo-loader ng-if="carregando" mensagem="Carregando publicações..."></amigo-loader>

    <div class="feed-status" ng-if="semMaisPosts && posts.length > 0">
      <div class="feed-status__divider"></div>
      <small class="feed-status__text">Você chegou ao fim do feed.</small>
    </div>

    <div class="feed-status feed-status--empty" ng-if="!carregando && posts.length === 0 && semMaisPosts">
      <p class="feed-status__icon">📭</p>
      <p class="feed-status__text">Nenhuma publicação ainda.<br>Seja o primeiro a publicar!</p>
    </div>

  </main>
</div>

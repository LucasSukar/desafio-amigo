<div class="doca-modal modal-editar-perfil">
  <div class="modal-editar-perfil__header">
    <h2 class="modal-editar-perfil__title">Editar Perfil</h2>
    <button class="doca-button doca-button--tertiary" ng-click="cancelar()" id="btn-fechar-modal-editar-perfil"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="modal-editar-perfil__content">
    <div class="doca-alert doca-alert--danger doca-mb-3" ng-if="erro">
      <span class="doca-alert__text">{{ erro }}</span>
    </div>

    <div class="modal-editar-perfil__avatar-section">
      <div style="position: relative;">
        <img ng-if="avatarPreview" ng-src="{{ avatarPreview }}" alt="Preview" class="modal-editar-perfil__avatar-img" />
        <img ng-if="!avatarPreview && usuario.avatar_url" ng-src="http://localhost:3334/uploads/{{ usuario.avatar_url }}" alt="Foto do usuário" class="modal-editar-perfil__avatar-img" />
        <div ng-if="!avatarPreview && !usuario.avatar_url" class="modal-editar-perfil__avatar-placeholder">
          {{ usuario.name ? usuario.name.charAt(0).toUpperCase() : '?' }}
        </div>
      </div>

      <label for="input-avatar" class="doca-button doca-button--secondary modal-editar-perfil__avatar-btn">
        <i class="fa-solid fa-camera"></i> {{ avatarPreview ? 'Trocar foto' : 'Alterar Foto' }}
      </label>
      <input type="file" id="input-avatar" accept="image/*" onchange="angular.element(this).scope().selecionarAvatar()" style="display: none;" />
    </div>

    <div class="doca-form__field doca-mb-3">
      <label class="doca-form__label">Nome Completo</label>
      <input class="doca-form-control" type="text" ng-model="editando.name" placeholder="Digite o novo nome" id="input-nome-perfil" />
    </div>

    <div class="doca-form__field doca-mb-3">
      <label class="doca-form__label">E-mail</label>
      <input class="doca-form-control" type="email" ng-model="editando.email" placeholder="Digite o novo e-mail" id="input-email-perfil" />
    </div>

    <button
      class="modal-editar-perfil__toggle-senha"
      ng-click="trocarSenha = !trocarSenha"
      id="btn-toggle-trocar-senha"
      type="button"
    >
      <i class="fa-solid" ng-class="trocarSenha ? 'fa-chevron-up' : 'fa-lock'"></i>
      <span ng-if="!trocarSenha">Trocar senha</span>
      <span ng-if="trocarSenha">Cancelar troca de senha</span>
    </button>

    <div ng-if="trocarSenha" class="modal-editar-perfil__senha-section">
      <div class="doca-form__field doca-mb-3">
        <label class="doca-form__label">Senha Atual</label>
        <input class="doca-form-control" type="password" ng-model="editando.oldPassword" placeholder="Sua senha atual" id="input-senha-antiga-perfil" />
      </div>

      <div class="doca-form__field doca-mb-3">
        <label class="doca-form__label">Nova Senha</label>
        <input class="doca-form-control" type="password" ng-model="editando.password" placeholder="Mínimo 6 caracteres" id="input-nova-senha-perfil" />
      </div>

      <div class="doca-form__field">
        <label class="doca-form__label">Confirmar Nova Senha</label>
        <input class="doca-form-control" type="password" ng-model="editando.confirmPassword" placeholder="Confirme a nova senha" id="input-confirmar-senha-perfil" />
      </div>
    </div>
  </div>

  <!-- Zona de perigo -->
  <div class="perfil-page__danger-zone" style="margin: 0 1.5rem 1.5rem 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
    <h3 class="perfil-page__danger-title"><i class="fa-solid fa-triangle-exclamation"></i> Zona de Perigo</h3>
    <p class="perfil-page__danger-desc">Ao excluir sua conta, todos os seus dados, posts e seguidores serão removidos permanentemente.</p>
    <button class="btn-danger-ghost" ng-click="excluirConta()" id="btn-excluir-conta">
      <i class="fa-solid fa-trash-can"></i> Excluir minha conta
    </button>
  </div>

  <div class="modal-editar-perfil__footer">
    <button class="doca-button doca-button--tertiary" ng-click="cancelar()" id="btn-cancelar-editar-perfil">Cancelar</button>
    <button class="doca-button doca-button--primary" ng-click="salvarPerfil()" ng-disabled="salvando" id="btn-salvar-editar-perfil">
      <span ng-if="!salvando">Salvar Alterações</span>
      <span ng-if="salvando">Salvando...</span>
    </button>
  </div>
</div>

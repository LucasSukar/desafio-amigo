<div class="doca-page criar-pub-page">
  <div class="criar-pub-page__top-bar">
    <h1 class="criar-pub-page__title">Nova Publicação</h1>
    <button class="doca-button doca-button--secondary" ng-click="voltarParaFeed()" id="btn-voltar-feed">← Voltar ao Feed</button>
  </div>

  <div class="criar-pub-page__box">
    <div class="doca-alert doca-alert--success doca-mb-3" ng-if="sucesso">
      <span class="doca-alert__text">{{ sucesso }}</span>
    </div>
    <div class="doca-alert doca-alert--danger doca-mb-3" ng-if="erro">
      <span class="doca-alert__text">{{ erro }}</span>
    </div>

    <div class="doca-form__field doca-mb-3">
      <label class="doca-form__label" for="input-titulo">Título</label>
      <input
        id="input-titulo"
        class="doca-form-control"
        type="text"
        ng-model="novaPublicacao.title"
        placeholder="Digite o título da publicação"
      />
    </div>

    <div class="doca-form__field doca-mb-3">
      <label class="doca-form__label" for="input-resumo">Resumo</label>
      <input
        id="input-resumo"
        class="doca-form-control"
        type="text"
        ng-model="novaPublicacao.resume"
        placeholder="Um breve resumo do conteúdo"
      />
    </div>

    <div class="doca-form__field doca-mb-3">
      <label class="doca-form__label" for="input-conteudo">Conteúdo</label>
      <textarea
        id="input-conteudo"
        class="doca-form-control criar-pub-page__textarea"
        ng-model="novaPublicacao.content"
        placeholder="Escreva o conteúdo completo aqui..."
        rows="8"
      ></textarea>
    </div>

    <div class="criar-pub-page__actions">
      <button class="doca-button doca-button--secondary" ng-click="voltarParaFeed()" id="btn-cancelar-pub">Cancelar</button>
      <button class="doca-button doca-button--primary" ng-click="publicar()" ng-disabled="publicando" id="btn-publicar">
        <span ng-if="!publicando">Publicar</span>
        <span ng-if="publicando">Publicando...</span>
      </button>
    </div>
  </div>
</div>
